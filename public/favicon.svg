<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2c"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e09f58"/>
      <stop offset="100%" stop-color="#c8792a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#262b36" stroke-width="12"/>

  <!-- Briefcase Icon -->
  <!-- Handle -->
  <path d="M 192 168 C 192 140, 214 118, 242 118 L 270 118 C 298 118, 320 140, 320 168 L 320 192 L 192 192 Z" fill="none" stroke="url(#iconGrad)" stroke-width="28" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="100" y="192" width="312" height="210" rx="36" fill="none" stroke="url(#iconGrad)" stroke-width="28"/>
  <path d="M 100 270 L 412 270" stroke="url(#iconGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Search / Magnifying Accent -->
  <circle cx="316" cy="316" r="54" fill="#12151c" stroke="url(#accentGrad)" stroke-width="22"/>
  <line x1="354" y1="354" x2="396" y2="396" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
</svg>
