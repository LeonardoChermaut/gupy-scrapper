<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vagas Gupy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="wrap">
      <header class="header">
        <div class="header-brand">
          <h1 class="header-title">Vagas Via Gupy</h1>
          <p class="header-sub">
            Busca direta na API pública do portal Gupy · Feito por:
            <a
              href="https://github.com/LeonardoChermaut"
              target="_blank"
              rel="noopener noreferrer"
              >github.com/LeonardoChermaut</a
            >
          </p>
        </div>
      </header>

      <div class="filters" id="filters"></div>
      <div class="sort-toggle" id="sortToggle"></div>

      <div class="searchbar">
        <input
          type="text"
          id="search"
          placeholder="Buscar por título (jobName)..."
          autocomplete="off"
        />
      </div>

      <div class="toolbar" id="toolbar">
        <div
          class="layout-toggle"
          id="layoutToggle"
          role="radiogroup"
          aria-label="Formato de exibição"
        >
          <button
            type="button"
            class="layout-btn active"
            data-columns="1"
            aria-pressed="true"
            title="Exibir em lista"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="1"
                y="1"
                width="12"
                height="12"
                rx="1.5"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <rect
                x="3"
                y="3.5"
                width="8"
                height="1.5"
                rx="0.5"
                fill="currentColor"
              />
              <rect
                x="3"
                y="6.25"
                width="8"
                height="1.5"
                rx="0.5"
                fill="currentColor"
              />
              <rect
                x="3"
                y="9"
                width="8"
                height="1.5"
                rx="0.5"
                fill="currentColor"
              />
            </svg>
          </button>
          <button
            type="button"
            class="layout-btn"
            data-columns="2"
            aria-pressed="false"
            title="Exibir em grade"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="1"
                y="1"
                width="12"
                height="12"
                rx="1.5"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <rect
                x="3"
                y="3.5"
                width="3.5"
                height="3"
                rx="0.5"
                fill="currentColor"
              />
              <rect
                x="7.5"
                y="3.5"
                width="3.5"
                height="3"
                rx="0.5"
                fill="currentColor"
              />
              <rect
                x="3"
                y="7.5"
                width="3.5"
                height="3"
                rx="0.5"
                fill="currentColor"
              />
              <rect
                x="7.5"
                y="7.5"
                width="3.5"
                height="3"
                rx="0.5"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <div class="list" id="list"></div>
      <div class="pagination" id="pagination"></div>

      <footer>
        Dados via api
        <a
          href="https://portal.gupy.io"
          target="_blank"
          rel="noopener noreferrer"
          >portal.gupy.io</a
        >·
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
